<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpongeBob Cursor</title>
    <style>
    .no-select {
        -webkit-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }

    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: black;
        cursor: url('spongebob.png'), auto;
    }
    </style>
</head>
<body class="no-select">
    <audio loop autoplay src="spongebob.mp3"></audio>
    
    <center style="margin-top: 20vh;">
        <img src="spongebob.png" alt="SpongeBob">
    </center>

    <script src="https://unpkg.com"></script>
    <script>
        window.addEventListener("load", () => {
            new cursoreffects.ghostCursor({
                image: "spongebob.png"
            });
        });
    </script>
</body>
</html>
