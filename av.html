  let shuffled = [];

  // Initialize Web Audio API immediately
  const audio = document.getElementById('audio');
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');

  let audioContext, analyser, bufferLength, dataArray;

  // Set up Web Audio API once
  function setupAudioContext() {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaElementSource(audio);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    source.connect(analyser);
    analyser.connect(audioContext.destination);
  }

  // Start drawing visualizer when audio plays
  function startVisualizer() {
    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const barHeight = dataArray[i] / 2;
        const color = `hsl(30, 100%, 50%)`; // Orange
        ctx.fillStyle = color;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }
    draw();
  }

  function cleanSongName(path) {
    let name = path.split("/").pop().replace(".mp3", "");
    name = name.replace(/\(.*?lyrics.*?\)/gi, "");
    name = name.replace(/\(.*?official.*?\)/gi, "");
    name = name.replace(/\(.*?visualizer.*?\)/gi, "");
    name = name.replace(/\(.*?audio.*?\)/gi, "");
    name = name.replace(/\(.*?lyric video.*?\)/gi, "");
    name = name.replace(/\s4$/g, "");
    name = name.replace(/_/g, " ");
    name = name.replace(/\s+/g, " ").trim();
    return name;
  }

  function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function startShuffle() {
    shuffled = shuffle([...songs]);
    currentIndex = 0;
    playNext();
  }

  function playNext() {
    if (currentIndex >= shuffled.length) {
      startShuffle();
      return;
    }

    const songPath = shuffled[currentIndex];
    audio.src = songPath;

    const cleanName = cleanSongName(songPath);
    document.getElementById("text").textContent = "Playing " + cleanName;
    document.getElementById("thumb").src = "audio-speakers.png";

    const nowPlaying = document.getElementById("nowPlaying");
    nowPlaying.classList.add("show");
    setTimeout(() => {
      nowPlaying.classList.remove("show");
    }, 4000);

    audio.play().catch(e => {
      console.log("Audio play failed - user gesture required");
    });
  }

  // Initialize audio context on first click
  document.body.addEventListener("click", () => {
    if (!audioContext) {
      setupAudioContext();
    }
    startShuffle();
    startVisualizer(); // Start drawing immediately after audio plays
    document.getElementById("instruction").style.display = "none";
  }, { once: true });

  document.getElementById("audio").addEventListener("ended", () => {
    currentIndex++;
    playNext();
  });
