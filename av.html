  // Add Cava-style visualizer with frequency mapping (bass = middle bars, highs = outer bars)
  const audio = document.getElementById('audio');
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');

  let analyser, bufferLength, dataArray;

  audio.addEventListener('play', () => {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaElementSource(audio);
    analyser = audioContext.createAnalyser();
    source.connect(analyser);
    analyser.connect(audioContext.destination);
    analyser.fftSize = 256;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    function draw() {
      requestAnimationFrame(draw);
      analyser.getByteFrequencyData(dataArray);

      // Clear with transparent background
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const barWidth = Math.max(1, (canvas.width / bufferLength) * 2.5);
      let x = 0;

      // Map frequency bins to visual bars — bass (low freq) affects middle, highs affect edges
      for (let i = 0; i < bufferLength; i++) {
        // Normalize index to 0-1
        const normalizedIndex = i / bufferLength;
        
        // Bass emphasis: middle bars get boosted by low frequencies
        let barHeight = (dataArray[i] / 255) * canvas.height * 0.9; // 90% of canvas height max
        
        // Boost middle bars for bass (0.3 to 0.7 range)
        if (normalizedIndex > 0.3 && normalizedIndex < 0.7) {
          barHeight *= 1.5; // Boost bass response in middle
        }
        // Slight boost for high frequencies (vocals, cymbals) on outer bars
        else if (normalizedIndex > 0.8 || normalizedIndex < 0.2) {
          barHeight *= 1.2;
        }

        // Cap height to canvas
        if (barHeight > canvas.height) barHeight = canvas.height;

        // Color: orange for all, but you can vary by freq if desired
        const color = `hsl(30, 100%, 50%)`;
        ctx.fillStyle = color;
        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 1;
      }
    }
    draw();
  });
